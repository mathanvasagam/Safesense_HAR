[build-system]
requires = ["setuptools==70.3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "safesense"
version = "0.1.0"
description = "Robust and efficient skeleton-inertial human activity recognition experiments"
requires-python = ">=3.10,<3.11"

[project.optional-dependencies]
paper = ["matplotlib==3.10.5", "scipy==1.15.3"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
safesense = "safesense.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
